<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADEN.SORU.ARSİVİ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
body{font-family:Arial;background:#061326;color:white;margin:0;padding:20px}
.card{background:#0d2444;padding:20px;border-radius:15px;margin-bottom:15px}
button{background:#1476ff;color:white;border:0;padding:12px;border-radius:8px;width:100%;margin-top:10px}
select,input{width:100%;padding:12px;margin-top:10px;border-radius:8px}
.file{padding:10px;border-bottom:1px solid #315}
</style>
</head>
<body>

<h1>☁ MADEN.SORU.ARSİVİ</h1>

<div class="card">
<h2>PDF Yükle</h2>

<select id="sinif">
<option value="9">9. Sınıf</option>
<option value="10">10. Sınıf</option>
<option value="11">11. Sınıf</option>
<option value="12">12. Sınıf</option>
</select>

<select id="ders">
<option>Matematik</option>
<option>Fizik</option>
<option>Kimya</option>
<option>Biyoloji</option>
<option>Edebiyat</option>
<option>Paragraf</option>
<option>Tarih</option>
<option>Coğrafya</option>
<option>Geometri</option>
</select>

<input type="file" id="pdf" accept="application/pdf">
<button onclick="upload()">Drive'a Yükle</button>
</div>


<div class="card">
<h2>Drive Dosyaları</h2>

<select id="lsinif">
<option value="9">9. Sınıf</option>
<option value="10">10. Sınıf</option>
<option value="11">11. Sınıf</option>
<option value="12">12. Sınıf</option>
</select>

<select id="lders">
<option>Matematik</option>
<option>Fizik</option>
<option>Kimya</option>
<option>Biyoloji</option>
<option>Edebiyat</option>
<option>Paragraf</option>
<option>Tarih</option>
<option>Coğrafya</option>
<option>Geometri</option>
</select>

<button onclick="listele()">Dosyaları Listele</button>
<div id="files"></div>
</div>


<script>
const API="https://madensoruserver.onrender.com";

async function upload(){

let file=document.getElementById("pdf").files[0];

if(!file){
 alert("PDF seçin");
 return;
}

let fd=new FormData();
fd.append("pdf",file);
fd.append("sinif",document.getElementById("sinif").value);
fd.append("ders",document.getElementById("ders").value);

let r=await fetch(API+"/upload",{method:"POST",body:fd});
let j=await r.json();

alert(j.message || "Tamam");
}


async function listele(){

let s=document.getElementById("lsinif").value;
let d=document.getElementById("lders").value;

let r=await fetch(API+"/files/"+s+"/"+d);
let j=await r.json();

let box=document.getElementById("files");
box.innerHTML="";

(j.files||[]).forEach(f=>{

box.innerHTML+=`
<div class="file">
${f.name}
<br>
<button onclick="indir('${f.id}')">İndir</button>
</div>`;

});

}

function indir(id){

window.open(API+"/download/"+id,"_blank");

}


if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}

</script>

</body>
</html>
